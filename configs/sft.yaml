model_name: "Qwen/Qwen3-8B-Instruct"
max_seq_length: 4096
load_in_4bit: true
dtype: null  # let Unsloth auto-detect (bf16 on Ampere+, fp16 on T4)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  seed: 42
  save_strategy: epoch
  logging_steps: 10
  output_dir: "outputs/sft_run"

data:
  train_path: "data/extracted/train.jsonl"
  val_path: "data/extracted/val.jsonl"

wandb:
  enabled: false
  project: "bilarabi-finetune"
  run_name: null  # defaults to output_dir basename if unset
